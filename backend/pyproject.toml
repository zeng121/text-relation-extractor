[project]
name = "text-relation-extractor-backend"
version = "0.1.0"
description = "Backend for a text relationship graph MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "httpx==0.28.1",
  "pydantic==2.9.2",
  "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
  "mypy>=1.18.2,<2",
  "pytest>=8.4.2,<9",
  "pytest-cov>=7.0.0,<8",
  "ruff>=0.14.1,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
