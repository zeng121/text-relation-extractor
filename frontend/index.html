<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Relation Extractor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="panel input-panel">
        <h1>Text Relation Extractor</h1>
        <p>粘贴一段人物/组织/项目描述，生成关系图、时间线和节点详情。</p>

        <label for="exampleSelect">示例文本</label>
        <select id="exampleSelect">
          <option value="default">团队协作</option>
          <option value="startup">创业项目</option>
          <option value="campus">校园活动</option>
        </select>

        <textarea id="inputText"></textarea>
        <button id="generateBtn">生成图谱</button>
        <p id="status" class="status">准备好了，点按钮试试。</p>
      </aside>

      <main class="panel graph-panel">
        <div id="graph"></div>
      </main>

      <aside class="panel result-panel">
        <section>
          <h2>节点详情</h2>
          <div id="detailCard" class="card muted">点击图中的节点查看详情。</div>
        </section>

        <section>
          <h2>时间线</h2>
          <div id="timeline" class="timeline muted">暂无事件。</div>
        </section>

        <section>
          <h2>结构化结果</h2>
          <pre id="jsonOutput"></pre>
        </section>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
